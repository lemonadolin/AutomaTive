name: Build Windows EXE

# Produces the REAL Windows executable on a Windows runner. A Linux PyInstaller
# build is never a Windows build, so packaging only ever runs on windows-latest.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Windows dependencies
        run: |
          python -m pip install -r requirements-win.txt
          python -m pip install pyinstaller pytest

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm PCAutopilot.spec

      - name: Smoke-test the packaged executable
        env:
          PCAUTOPILOT_SELFTEST: '1'
        run: |
          .\dist\PCAutopilot\PCAutopilot.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged exe self-test failed" }

      - name: Zip release folder
        run: Compress-Archive -Path dist\PCAutopilot\* -DestinationPath PCAutopilot-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCAutopilot-windows
          path: PCAutopilot-windows.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PCAutopilot-windows.zip
